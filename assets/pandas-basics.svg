<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><rect width="1080" height="1920" fill="#152044"/><rect x="72" y="90" width="12" height="146" rx="6" fill="#8fa8ff"/><text x="112" y="150" fill="#c8d4ff" font-family="Microsoft YaHei,sans-serif" font-size="32" font-weight="700">Pandas · 表格基础</text><text x="72" y="250" fill="#fff" font-family="Microsoft YaHei,sans-serif" font-size="68" font-weight="700">先认识表，</text><text x="72" y="332" fill="#fff" font-family="Microsoft YaHei,sans-serif" font-size="68" font-weight="700">再从表里取答案。</text><rect x="72" y="390" width="936" height="225" rx="30" fill="#293568" stroke="#6578c2" stroke-width="2"/><text x="112" y="455" fill="#8fa8ff" font-family="Microsoft YaHei,sans-serif" font-size="32" font-weight="700">先想什么？</text><text x="112" y="512" fill="#fff" font-family="Microsoft YaHei,sans-serif" font-size="36">DataFrame 是带列名的表；取数前先确认列与类型。</text><text x="112" y="564" fill="#dce3ff" font-family="Microsoft YaHei,sans-serif" font-size="29">「看全貌」与「按条件选行」是两件不同的事。</text><text x="72" y="700" fill="#fff" font-family="Microsoft YaHei,sans-serif" font-size="38" font-weight="700">取数流程</text><g font-family="Microsoft YaHei,sans-serif"><rect x="72" y="748" width="936" height="128" rx="24" fill="#f5f7ff"/><text x="110" y="805" fill="#22305d" font-size="34" font-weight="700">1　读入一张表</text><text x="110" y="851" fill="#3d5295" font-family="Consolas,monospace" font-size="30">pd.read_csv()</text><path d="M540 888v45" stroke="#8fa8ff" stroke-width="7"/><path d="M525 918l15 15 15-15" fill="none" stroke="#8fa8ff" stroke-width="7"/><rect x="72" y="950" width="936" height="128" rx="24" fill="#e0e6ff"/><text x="110" y="1007" fill="#22305d" font-size="34" font-weight="700">2　先验明数据身份</text><text x="110" y="1053" fill="#3d5295" font-family="Consolas,monospace" font-size="30">df.head() / df.columns / df.dtypes</text><path d="M540 1090v45" stroke="#8fa8ff" stroke-width="7"/><path d="M525 1120l15 15 15-15" fill="none" stroke="#8fa8ff" stroke-width="7"/><rect x="72" y="1152" width="936" height="128" rx="24" fill="#f5f7ff"/><text x="110" y="1209" fill="#22305d" font-size="34" font-weight="700">3　取一列来计算或查看</text><text x="110" y="1255" fill="#3d5295" font-family="Consolas,monospace" font-size="30">df['col']</text><path d="M540 1292v45" stroke="#8fa8ff" stroke-width="7"/><path d="M525 1322l15 15 15-15" fill="none" stroke="#8fa8ff" stroke-width="7"/><rect x="72" y="1354" width="936" height="128" rx="24" fill="#e0e6ff"/><text x="110" y="1411" fill="#22305d" font-size="34" font-weight="700">4　按规则保留行</text><text x="110" y="1457" fill="#3d5295" font-family="Consolas,monospace" font-size="30">df[condition]</text></g><rect x="72" y="1530" width="450" height="235" rx="28" fill="#4a3469"/><text x="108" y="1590" fill="#d9c6ff" font-family="Microsoft YaHei,sans-serif" font-size="31" font-weight="700">易错点</text><text x="108" y="1642" fill="#fff" font-family="Microsoft YaHei,sans-serif" font-size="27">不看 dtypes 就筛选，</text><text x="108" y="1684" fill="#fff" font-family="Microsoft YaHei,sans-serif" font-size="27">数字可能其实是文本。</text><rect x="558" y="1530" width="450" height="235" rx="28" fill="#76541d"/><text x="594" y="1590" fill="#ffe3a0" font-family="Microsoft YaHei,sans-serif" font-size="31" font-weight="700">30秒自测</text><text x="594" y="1642" fill="#fff" font-family="Microsoft YaHei,sans-serif" font-size="27">若只要满足条件的行，</text><text x="594" y="1684" fill="#fff" font-family="Microsoft YaHei,sans-serif" font-size="27">应该用哪种方括号？</text><text x="72" y="1840" fill="#c8d4ff" font-family="Microsoft YaHei,sans-serif" font-size="26">学习卡 04 / 06</text></svg>
