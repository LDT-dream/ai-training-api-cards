<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#2a1040"/><stop offset="1" stop-color="#6b2357"/></linearGradient></defs><rect width="1080" height="1920" fill="url(#b)"/>
<rect x="72" y="90" width="12" height="146" rx="6" fill="#ffba70"/><text x="112" y="150" fill="#ffd7aa" font-family="Microsoft YaHei,sans-serif" font-size="32" font-weight="700">图像 · 预处理</text><text x="72" y="250" fill="#fff" font-family="Microsoft YaHei,sans-serif" font-size="68" font-weight="700">先解决问题，</text><text x="72" y="332" fill="#fff" font-family="Microsoft YaHei,sans-serif" font-size="68" font-weight="700">再动手改像素。</text>
<rect x="72" y="390" width="936" height="225" rx="30" fill="#6b285a" stroke="#b76386" stroke-width="2"/><text x="112" y="455" fill="#ffba70" font-family="Microsoft YaHei,sans-serif" font-size="32" font-weight="700">先想什么？</text><text x="112" y="512" fill="#fff" font-family="Microsoft YaHei,sans-serif" font-size="36">噪声、模糊、对比度是不同问题，工具不能混用。</text><text x="112" y="564" fill="#ffe3e6" font-family="Microsoft YaHei,sans-serif" font-size="29">所有增强后都要回到可显示的 0–255 像素范围。</text>
<text x="72" y="700" fill="#fff" font-family="Microsoft YaHei,sans-serif" font-size="38" font-weight="700">处理流程</text><g font-family="Microsoft YaHei,sans-serif"><rect x="72" y="748" width="936" height="128" rx="24" fill="#fff5f2"/><text x="110" y="805" fill="#551b48" font-size="34" font-weight="700">1　先辨别问题：噪声还是细节不够？</text><path d="M540 888v45" stroke="#ffba70" stroke-width="7"/><path d="M525 918l15 15 15-15" fill="none" stroke="#ffba70" stroke-width="7"/><rect x="72" y="950" width="936" height="128" rx="24" fill="#f9d9e4"/><text x="110" y="1007" fill="#551b48" font-size="34" font-weight="700">2　平滑噪声</text><text x="110" y="1053" fill="#7b2b58" font-family="Consolas,monospace" font-size="30">cv2.GaussianBlur()</text><path d="M540 1090v45" stroke="#ffba70" stroke-width="7"/><path d="M525 1120l15 15 15-15" fill="none" stroke="#ffba70" stroke-width="7"/><rect x="72" y="1152" width="936" height="128" rx="24" fill="#fff5f2"/><text x="110" y="1209" fill="#551b48" font-size="34" font-weight="700">3　强调边缘 / 调整亮度对比</text><text x="110" y="1255" fill="#7b2b58" font-family="Consolas,monospace" font-size="27">np.array + cv2.filter2D() / cv2.convertScaleAbs(alpha, beta)</text><path d="M540 1292v45" stroke="#ffba70" stroke-width="7"/><path d="M525 1322l15 15 15-15" fill="none" stroke="#ffba70" stroke-width="7"/><rect x="72" y="1354" width="936" height="128" rx="24" fill="#f9d9e4"/><text x="110" y="1411" fill="#551b48" font-size="34" font-weight="700">4　裁回合法范围</text><text x="110" y="1457" fill="#7b2b58" font-family="Consolas,monospace" font-size="30">np.clip(..., 0, 255)</text></g>
<rect x="72" y="1530" width="450" height="235" rx="28" fill="#54366c"/><text x="108" y="1590" fill="#d9c2ff" font-family="Microsoft YaHei,sans-serif" font-size="31" font-weight="700">易错点</text><text x="108" y="1642" fill="#fff" font-family="Microsoft YaHei,sans-serif" font-size="27">锐化会放大噪声；</text><text x="108" y="1684" fill="#fff" font-family="Microsoft YaHei,sans-serif" font-size="27">加均匀噪声后别忘了 clip。</text><rect x="558" y="1530" width="450" height="235" rx="28" fill="#805e22"/><text x="594" y="1590" fill="#ffe3a0" font-family="Microsoft YaHei,sans-serif" font-size="31" font-weight="700">30秒自测</text><text x="594" y="1642" fill="#fff" font-family="Microsoft YaHei,sans-serif" font-size="27">图像有噪点时，</text><text x="594" y="1684" fill="#fff" font-family="Microsoft YaHei,sans-serif" font-size="27">先选锐化还是高斯模糊？</text><text x="72" y="1840" fill="#ffd7aa" font-family="Microsoft YaHei,sans-serif" font-size="26">学习卡 02 / 06</text></svg>
