<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><rect width="1080" height="1920" fill="#102d38"/><rect x="72" y="90" width="12" height="146" rx="6" fill="#78dcff"/><text x="112" y="150" fill="#b8efff" font-family="Microsoft YaHei,sans-serif" font-size="32" font-weight="700">Matplotlib · 显示图像</text><text x="72" y="250" fill="#fff" font-family="Microsoft YaHei,sans-serif" font-size="68" font-weight="700">显示正确，</text><text x="72" y="332" fill="#fff" font-family="Microsoft YaHei,sans-serif" font-size="68" font-weight="700">才谈观察正确。</text><rect x="72" y="390" width="936" height="225" rx="30" fill="#174958" stroke="#4c8290" stroke-width="2"/><text x="112" y="455" fill="#78dcff" font-family="Microsoft YaHei,sans-serif" font-size="32" font-weight="700">先想什么？</text><text x="112" y="512" fill="#fff" font-family="Microsoft YaHei,sans-serif" font-size="36">画面颜色错，常常不是图错，而是颜色通道解释错。</text><text x="112" y="564" fill="#d2edf4" font-family="Microsoft YaHei,sans-serif" font-size="29">显示时的顺序：颜色 → 画布 → 画面信息。</text><text x="72" y="700" fill="#fff" font-family="Microsoft YaHei,sans-serif" font-size="38" font-weight="700">展示流程</text><g font-family="Microsoft YaHei,sans-serif"><rect x="72" y="748" width="936" height="128" rx="24" fill="#f5fdff"/><text x="110" y="805" fill="#17404e" font-size="34" font-weight="700">1　把 OpenCV 的颜色顺序转正</text><text x="110" y="851" fill="#22677b" font-family="Consolas,monospace" font-size="26">cv2.cvtColor(img, cv2.COLOR_BGR2RGB)</text><path d="M540 888v45" stroke="#78dcff" stroke-width="7"/><path d="M525 918l15 15 15-15" fill="none" stroke="#78dcff" stroke-width="7"/><rect x="72" y="950" width="936" height="128" rx="24" fill="#d9f5fb"/><text x="110" y="1007" fill="#17404e" font-size="34" font-weight="700">2　需要比较就排版</text><text x="110" y="1053" fill="#22677b" font-family="Consolas,monospace" font-size="30">plt.subplots()</text><path d="M540 1090v45" stroke="#78dcff" stroke-width="7"/><path d="M525 1120l15 15 15-15" fill="none" stroke="#78dcff" stroke-width="7"/><rect x="72" y="1152" width="936" height="128" rx="24" fill="#f5fdff"/><text x="110" y="1209" fill="#17404e" font-size="34" font-weight="700">3　展示图像并说明内容</text><text x="110" y="1255" fill="#22677b" font-family="Consolas,monospace" font-size="30">plt.imshow()  /  plt.title()</text><path d="M540 1292v45" stroke="#78dcff" stroke-width="7"/><path d="M525 1322l15 15 15-15" fill="none" stroke="#78dcff" stroke-width="7"/><rect x="72" y="1354" width="936" height="128" rx="24" fill="#d9f5fb"/><text x="110" y="1411" fill="#17404e" font-size="34" font-weight="700">4　去掉无关坐标</text><text x="110" y="1457" fill="#22677b" font-family="Consolas,monospace" font-size="30">plt.axis('off')</text></g><rect x="72" y="1530" width="450" height="235" rx="28" fill="#493363"/><text x="108" y="1590" fill="#d5c3ff" font-family="Microsoft YaHei,sans-serif" font-size="31" font-weight="700">易错点</text><text x="108" y="1642" fill="#fff" font-family="Microsoft YaHei,sans-serif" font-size="28">直接 imshow BGR 图，</text><text x="108" y="1684" fill="#fff" font-family="Microsoft YaHei,sans-serif" font-size="28">红蓝颜色会颠倒。</text><rect x="558" y="1530" width="450" height="235" rx="28" fill="#73531f"/><text x="594" y="1590" fill="#ffe3a0" font-family="Microsoft YaHei,sans-serif" font-size="31" font-weight="700">30秒自测</text><text x="594" y="1642" fill="#fff" font-family="Microsoft YaHei,sans-serif" font-size="28">为何转换 RGB</text><text x="594" y="1684" fill="#fff" font-family="Microsoft YaHei,sans-serif" font-size="28">要放在 imshow 之前？</text><text x="72" y="1840" fill="#b8efff" font-family="Microsoft YaHei,sans-serif" font-size="26">学习卡 03 / 06</text></svg>
