<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#091a36"/><stop offset="1" stop-color="#123b65"/></linearGradient></defs>
  <rect width="1080" height="1920" fill="url(#bg)"/>
  <rect x="72" y="90" width="12" height="146" rx="6" fill="#36d7c3"/><text x="112" y="150" fill="#9eece1" font-family="Microsoft YaHei, sans-serif" font-size="32" font-weight="700">OpenCV · 图像基础</text>
  <text x="72" y="250" fill="#fff" font-family="Microsoft YaHei, sans-serif" font-size="68" font-weight="700">读进来的图，</text><text x="72" y="332" fill="#fff" font-family="Microsoft YaHei, sans-serif" font-size="68" font-weight="700">到底是什么？</text>
  <rect x="72" y="390" width="936" height="225" rx="30" fill="#153e68" stroke="#3b7498" stroke-width="2"/>
  <text x="112" y="455" fill="#36d7c3" font-family="Microsoft YaHei, sans-serif" font-size="32" font-weight="700">先想什么？</text><text x="112" y="512" fill="#fff" font-family="Microsoft YaHei, sans-serif" font-size="36">图像是一个三维数字数组：位置 + 颜色通道。</text><text x="112" y="564" fill="#c7d9ec" font-family="Consolas, monospace" font-size="30">shape = (H, W, C)  ·  dtype = uint8</text>
  <text x="72" y="700" fill="#fff" font-family="Microsoft YaHei, sans-serif" font-size="38" font-weight="700">理解流程</text>
  <g font-family="Microsoft YaHei, sans-serif"><rect x="72" y="748" width="936" height="128" rx="24" fill="#fff"/><text x="110" y="805" fill="#18355a" font-size="34" font-weight="700">1　读取文件</text><text x="110" y="851" fill="#245f81" font-family="Consolas,monospace" font-size="30">cv2.imread()</text><path d="M540 888v45" stroke="#36d7c3" stroke-width="7"/><path d="M525 918l15 15 15-15" fill="none" stroke="#36d7c3" stroke-width="7"/>
  <rect x="72" y="950" width="936" height="128" rx="24" fill="#dffaf6"/><text x="110" y="1007" fill="#18355a" font-size="34" font-weight="700">2　确认结构</text><text x="110" y="1053" fill="#245f81" font-family="Consolas,monospace" font-size="30">img.shape / img.dtype</text><path d="M540 1090v45" stroke="#36d7c3" stroke-width="7"/><path d="M525 1120l15 15 15-15" fill="none" stroke="#36d7c3" stroke-width="7"/>
  <rect x="72" y="1152" width="936" height="128" rx="24" fill="#fff"/><text x="110" y="1209" fill="#18355a" font-size="34" font-weight="700">3　需要时换颜色</text><text x="110" y="1255" fill="#245f81" font-family="Consolas,monospace" font-size="30">cv2.cvtColor()</text><path d="M540 1292v45" stroke="#36d7c3" stroke-width="7"/><path d="M525 1322l15 15 15-15" fill="none" stroke="#36d7c3" stroke-width="7"/>
  <rect x="72" y="1354" width="936" height="128" rx="24" fill="#dffaf6"/><text x="110" y="1411" fill="#18355a" font-size="34" font-weight="700">4　调整到目标尺寸</text><text x="110" y="1457" fill="#245f81" font-family="Consolas,monospace" font-size="30">cv2.resize(..., (W, H))</text></g>
  <rect x="72" y="1530" width="450" height="235" rx="28" fill="#482c60"/><text x="108" y="1590" fill="#ffaed8" font-family="Microsoft YaHei, sans-serif" font-size="31" font-weight="700">易错点</text><text x="108" y="1642" fill="#fff" font-family="Microsoft YaHei, sans-serif" font-size="29">OpenCV 默认是 BGR，</text><text x="108" y="1684" fill="#fff" font-family="Microsoft YaHei, sans-serif" font-size="29">不是 RGB；尺寸顺序是 W,H。</text>
  <rect x="558" y="1530" width="450" height="235" rx="28" fill="#7d5423"/><text x="594" y="1590" fill="#ffe3a0" font-family="Microsoft YaHei, sans-serif" font-size="31" font-weight="700">30秒自测</text><text x="594" y="1642" fill="#fff" font-family="Microsoft YaHei, sans-serif" font-size="29">shape 的三个数</text><text x="594" y="1684" fill="#fff" font-family="Microsoft YaHei, sans-serif" font-size="29">分别说明什么？</text>
  <text x="72" y="1840" fill="#9eece1" font-family="Microsoft YaHei, sans-serif" font-size="26">学习卡 01 / 06</text>
</svg>
