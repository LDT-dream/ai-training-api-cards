<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><rect width="1080" height="1920" fill="#183534"/><rect x="72" y="90" width="12" height="146" rx="6" fill="#8ee7a8"/><text x="112" y="150" fill="#c6f8d4" font-family="Microsoft YaHei,sans-serif" font-size="32" font-weight="700">Pandas · 数据清洗</text><text x="72" y="250" fill="#fff" font-family="Microsoft YaHei,sans-serif" font-size="68" font-weight="700">先统一含义，</text><text x="72" y="332" fill="#fff" font-family="Microsoft YaHei,sans-serif" font-size="68" font-weight="700">再进行计算。</text><rect x="72" y="390" width="936" height="225" rx="30" fill="#245653" stroke="#5d9d88" stroke-width="2"/><text x="112" y="455" fill="#8ee7a8" font-family="Microsoft YaHei,sans-serif" font-size="32" font-weight="700">先想什么？</text><text x="112" y="512" fill="#fff" font-family="Microsoft YaHei,sans-serif" font-size="36">一列数据先变得可比较，后面的规则才有意义。</text><text x="112" y="564" fill="#d5f6df" font-family="Microsoft YaHei,sans-serif" font-size="29">清洗顺序：文本规范 → 时间识别 → 格式输出 → 规则计算。</text><text x="72" y="700" fill="#fff" font-family="Microsoft YaHei,sans-serif" font-size="38" font-weight="700">清洗流程</text><g font-family="Microsoft YaHei,sans-serif"><rect x="72" y="748" width="936" height="128" rx="24" fill="#f2fff5"/><text x="110" y="805" fill="#1b4a3f" font-size="34" font-weight="700">1　清除或替换文本中的杂质</text><text x="110" y="851" fill="#26725e" font-family="Consolas,monospace" font-size="30">str.replace()</text><path d="M540 888v45" stroke="#8ee7a8" stroke-width="7"/><path d="M525 918l15 15 15-15" fill="none" stroke="#8ee7a8" stroke-width="7"/><rect x="72" y="950" width="936" height="128" rx="24" fill="#d8f8e1"/><text x="110" y="1007" fill="#1b4a3f" font-size="34" font-weight="700">2　把日期文本变成时间</text><text x="110" y="1053" fill="#26725e" font-family="Consolas,monospace" font-size="30">pd.to_datetime()</text><path d="M540 1090v45" stroke="#8ee7a8" stroke-width="7"/><path d="M525 1120l15 15 15-15" fill="none" stroke="#8ee7a8" stroke-width="7"/><rect x="72" y="1152" width="936" height="128" rx="24" fill="#f2fff5"/><text x="110" y="1209" fill="#1b4a3f" font-size="34" font-weight="700">3　按需输出日期格式</text><text x="110" y="1255" fill="#26725e" font-family="Consolas,monospace" font-size="30">.dt.strftime()</text><path d="M540 1292v45" stroke="#8ee7a8" stroke-width="7"/><path d="M525 1322l15 15 15-15" fill="none" stroke="#8ee7a8" stroke-width="7"/><rect x="72" y="1354" width="936" height="128" rx="24" fill="#d8f8e1"/><text x="110" y="1411" fill="#1b4a3f" font-size="34" font-weight="700">4　逐值算规则，并设置上限</text><text x="110" y="1457" fill="#26725e" font-family="Consolas,monospace" font-size="28">apply(lambda x: min(x, upper))</text></g><rect x="72" y="1530" width="450" height="235" rx="28" fill="#48356b"/><text x="108" y="1590" fill="#d7c4ff" font-family="Microsoft YaHei,sans-serif" font-size="31" font-weight="700">易错点</text><text x="108" y="1642" fill="#fff" font-family="Microsoft YaHei,sans-serif" font-size="27">strftime 是格式化输出，</text><text x="108" y="1684" fill="#fff" font-family="Microsoft YaHei,sans-serif" font-size="27">不是把文本变日期。</text><rect x="558" y="1530" width="450" height="235" rx="28" fill="#75541f"/><text x="594" y="1590" fill="#ffe3a0" font-family="Microsoft YaHei,sans-serif" font-size="31" font-weight="700">30秒自测</text><text x="594" y="1642" fill="#fff" font-family="Microsoft YaHei,sans-serif" font-size="27">日期列是字符串，</text><text x="594" y="1684" fill="#fff" font-family="Microsoft YaHei,sans-serif" font-size="27">先 to_datetime 还是 strftime？</text><text x="72" y="1840" fill="#c6f8d4" font-family="Microsoft YaHei,sans-serif" font-size="26">学习卡 05 / 06</text></svg>
