<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><rect width="1080" height="1920" fill="#37242e"/><rect x="72" y="90" width="12" height="146" rx="6" fill="#ffb2a0"/><text x="112" y="150" fill="#ffd0c5" font-family="Microsoft YaHei,sans-serif" font-size="32" font-weight="700">scikit-learn · 训练模型</text><text x="72" y="250" fill="#fff" font-family="Microsoft YaHei,sans-serif" font-size="68" font-weight="700">先留出未知，</text><text x="72" y="332" fill="#fff" font-family="Microsoft YaHei,sans-serif" font-size="68" font-weight="700">再判断学得怎样。</text><rect x="72" y="390" width="936" height="225" rx="30" fill="#643c48" stroke="#b46f78" stroke-width="2"/><text x="112" y="455" fill="#ffb2a0" font-family="Microsoft YaHei,sans-serif" font-size="32" font-weight="700">先想什么？</text><text x="112" y="512" fill="#fff" font-family="Microsoft YaHei,sans-serif" font-size="36">模型必须在没见过的数据上接受检验，分数才有解释力。</text><text x="112" y="564" fill="#ffe0d8" font-family="Microsoft YaHei,sans-serif" font-size="29">训练、预测、评估是顺序明确的一条链。</text><text x="72" y="700" fill="#fff" font-family="Microsoft YaHei,sans-serif" font-size="38" font-weight="700">训练流程</text><g font-family="Microsoft YaHei,sans-serif"><rect x="72" y="748" width="936" height="128" rx="24" fill="#fff5f2"/><text x="110" y="805" fill="#653641" font-size="34" font-weight="700">1　切出测试集，保留未知答案</text><text x="110" y="851" fill="#934a5a" font-family="Consolas,monospace" font-size="25">train_test_split(..., test_size=.2)</text><path d="M540 888v45" stroke="#ffb2a0" stroke-width="7"/><path d="M525 918l15 15 15-15" fill="none" stroke="#ffb2a0" stroke-width="7"/><rect x="72" y="950" width="936" height="128" rx="24" fill="#ffdfe0"/><text x="110" y="1007" fill="#653641" font-size="34" font-weight="700">2　选择分类器</text><text x="110" y="1053" fill="#934a5a" font-family="Consolas,monospace" font-size="30">DecisionTreeClassifier()</text><path d="M540 1090v45" stroke="#ffb2a0" stroke-width="7"/><path d="M525 1120l15 15 15-15" fill="none" stroke="#ffb2a0" stroke-width="7"/><rect x="72" y="1152" width="936" height="128" rx="24" fill="#fff5f2"/><text x="110" y="1209" fill="#653641" font-size="34" font-weight="700">3　用训练集学习规则</text><text x="110" y="1255" fill="#934a5a" font-family="Consolas,monospace" font-size="30">model.fit(X_train, y_train)</text><path d="M540 1292v45" stroke="#ffb2a0" stroke-width="7"/><path d="M525 1322l15 15 15-15" fill="none" stroke="#ffb2a0" stroke-width="7"/><rect x="72" y="1354" width="936" height="128" rx="24" fill="#ffdfe0"/><text x="110" y="1411" fill="#653641" font-size="34" font-weight="700">4　预测并核对测试答案</text><text x="110" y="1457" fill="#934a5a" font-family="Consolas,monospace" font-size="27">predict() → accuracy_score()</text></g><rect x="72" y="1530" width="450" height="235" rx="28" fill="#4b3868"/><text x="108" y="1590" fill="#dbc9ff" font-family="Microsoft YaHei,sans-serif" font-size="31" font-weight="700">易错点</text><text x="108" y="1642" fill="#fff" font-family="Microsoft YaHei,sans-serif" font-size="27">用训练集打分，</text><text x="108" y="1684" fill="#fff" font-family="Microsoft YaHei,sans-serif" font-size="27">不能说明模型遇到未知数据的表现。</text><rect x="558" y="1530" width="450" height="235" rx="28" fill="#75521f"/><text x="594" y="1590" fill="#ffe3a0" font-family="Microsoft YaHei,sans-serif" font-size="31" font-weight="700">30秒自测</text><text x="594" y="1642" fill="#fff" font-family="Microsoft YaHei,sans-serif" font-size="27">为什么评估应使用</text><text x="594" y="1684" fill="#fff" font-family="Microsoft YaHei,sans-serif" font-size="27">测试集而非训练集？</text><text x="72" y="1840" fill="#ffd0c5" font-family="Microsoft YaHei,sans-serif" font-size="26">学习卡 06 / 06</text></svg>
