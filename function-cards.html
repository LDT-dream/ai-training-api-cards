<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10223d" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2310223d'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-family='Arial' font-size='38' font-weight='700' fill='white'%3Ef%3C/text%3E%3C/svg%3E" />
    <title>函数闪卡库 · AI 实操速记卡</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="function-cards.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="返回主学习页">AI <span>实操速记卡</span></a>
      <a class="text-link" href="index.html">← 返回主学习页</a>
    </header>
    <main class="function-main">
      <section class="function-hero" aria-labelledby="function-page-title">
        <p class="eyebrow">FUNCTION FLASHCARDS</p>
        <h1 id="function-page-title">函数闪卡库</h1>
        <p>一次只记一个函数：用途、参数、例子与记忆钩子。</p>
      </section>
      <section class="function-layout" aria-label="函数闪卡学习区">
        <aside class="function-sidebar">
          <h2>分类</h2>
          <div id="function-category-list" class="function-category-list" aria-label="函数分类"></div>
          <details class="function-library" open><summary>函数目录</summary><div id="function-library"></div></details>
        </aside>
        <section class="function-study" aria-label="当前函数卡">
          <div id="function-card" class="function-card" tabindex="-1" aria-live="polite"></div>
          <nav class="function-controls" aria-label="切换函数卡">
            <button id="function-previous" class="function-nav-button" type="button">← 上一张</button>
            <p id="function-position" aria-live="polite"></p>
            <button id="function-next" class="function-nav-button" type="button">下一张 →</button>
          </nav>
          <p class="keyboard-tip">可用键盘 ← / → 切换；在输入框或文本框中不会接管方向键。</p>
        </section>
      </section>
    </main>
    <script src="function-cards-data.js"></script>
    <script src="function-cards.js"></script>
  </body>
</html>
